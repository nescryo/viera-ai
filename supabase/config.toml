# Local Supabase CLI configuration for Viera.
# Requires Docker and the Supabase CLI (`npx supabase start` or `supabase start`).
# See docs/supabase-setup.md for the full local and cloud walkthrough.

project_id = "viera"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Disabled locally so email sign-up signs in immediately without opening Mailpit.
enable_confirmations = false
secure_password_change = false

# Optional OAuth providers for local development.
# Keep these blocks commented out unless you define the matching variables in `.env`
# (never prefix OAuth secrets with VITE_). Supabase CLI evaluates `env(...)` at startup
# even when `enabled = false`, so missing variables would stop `supabase start`.
# After editing this file, restart Supabase (`supabase stop && supabase start`).

# [auth.external.github]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
# redirect_uri = ""

